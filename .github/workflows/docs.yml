name: Docs Verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/verify-docs.py
      - run: python scripts/gen-index.py --check
      - run: python scripts/gen-capability-matrix.py --check