name: OmniScript CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: read-only contents by default; jobs that need more
# (e.g. trusted publishing) declare their own permissions explicitly.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check omni_compiler/ tests/ --exit-non-zero-on-fix

      - name: Run Ruff Format
        run: ruff format --check omni_compiler/ tests/

      - name: Run MyPy
        run: mypy --strict omni_compiler/ --show-error-codes

      - name: Run Bandit
        run: bandit -r omni_compiler --severity-level medium

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Tests with Coverage
        run: |
          pytest tests/ -v --tb=short --tb=native \
            --cov=omni_compiler --cov-branch --cov-fail-under=90 \
            --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true

  test-packages:
    name: OMNISYS Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run OMNISYS Package Tests with Coverage
        # --import-mode=importlib is required: multiple packages ship tests
        # with identical basenames (test_conformance.py, test_properties.py)
        # which collide under pytest's default import mode.
        # packages/conftest.py injects each package's src/ into sys.path.
        # Coverage gate set to 80% (baseline measured at ~99%); raise it once
        # the registry drift noted in CI is resolved.
        run: |
          python -m pytest packages/ -c pyproject.toml --import-mode=importlib \
            --cov=packages --cov-branch --cov-fail-under=80 \
            --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./coverage.xml
          flags: packages
          fail_ci_if_error: true

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test, test-packages]
    # Enforced gate: the mutation score must stay >= 80%. This runs on PRs
    # and pushes so a regression in mutation score blocks the merge.
    # If a baseline run proves the sustainable score differs from 80%,
    # adjust the threshold in the "Report Mutation Score" step - do not
    # re-enable continue-on-error or restrict this job to main only.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Mutation Testing
        run: |
          mutmut run
          mutmut export_cicd_stats

      - name: Report and Enforce Mutation Score
        run: |
          python - <<'EOF'
          import json
          with open('mutants/mutmut-cicd-stats.json') as f:
              d = json.load(f)
          total = d['total']
          killed = d['killed']
          if total == 0:
              raise SystemExit('ERROR: mutmut produced no mutants; the run did not execute.')
          score = killed / total * 100
          print(f'Mutation score: {score:.1f}% ({killed}/{total} mutants killed)')
          if score < 80.0:
              raise SystemExit(f'GATE FAILED: mutation score {score:.1f}% is below the 80% gate')
          EOF

  conformance:
    name: Conformance Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, test-packages]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Conformance Suite
        run: |
          pytest tests/conformance/ -v --tb=short

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, test-packages]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Benchmarks
        run: |
          python scripts/benchmark.py

      - name: Check Performance Gates
        run: |
          python scripts/check_performance_gates.py

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Docs
        run: python scripts/verify-docs.py

      - name: Verify Generated Index
        run: python scripts/gen-index.py --check

      - name: Verify Capability Matrix
        run: python scripts/gen-capability-matrix.py --check

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, test, test-packages, conformance]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # Trusted publishing (OIDC) to PyPI: the id-token is minted per-run
      # and exchanged for a short-lived PyPI token; no long-lived secrets.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        # Trusted publishing: no user/password are passed, so the action
        # exchanges the OIDC id-token for a PyPI token. Requires a PyPI
        # "pending publisher" for this repo + workflow + environment.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true