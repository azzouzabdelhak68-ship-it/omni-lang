[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-compiler"
version = "0.1.0"
description = "OmniScript v1.0 JS-First Compiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "hypothesis>=6.82.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "mutmut>=2.4.0",
    "radon>=6.0.0",
    "bandit>=1.7.0",
    "types-requests>=2.31.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
    disallow_untyped_defs = true
    disallow_incomplete_defs = true
    check_untyped_defs = true
    no_implicit_optional = true
    warn_return_any = true
    show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
files = ["omni_compiler", "tests"]
exclude = ["build", "dist", ".venv", ".pytest_cache"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E", "F", "I", "UP", "B", "SIM", "N", "D", "PL", "T20", "PTH", "ERA", "Q", "TID", "RET",
]
ignore = []
fixable = ["ALL"]
unfixable = []
extend-select = ["TID252", "ARG001", "ARG002"]
per-file-ignores = { "tests/*" = ["S101", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"] }

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.mutmut]
runner = "pytest"
paths_to_mutate = ["omni_compiler"]
backup = false
runner_options = ["-x", "--tb=short"]
tests_dir = "tests/"

[tool.coverage.run]
branch = true
source = ["omni_compiler"]
data_file = ".coverage"
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
targets = ["omni_compiler"]
exclude_dirs = ["tests", "__pycache__"]
severity_level = "medium"
confidence_level = "high"

[tool.radon]
min = "B"
max = "C"
average = "B"
exclude = "tests/*"

[tool.setuptools.packages.find]
where = ["."]
include = ["omni_compiler*"]

[tool.setuptools.package-dir]
"" = "."