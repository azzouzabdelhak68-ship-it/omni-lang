    "pure", "UI", "scene", "require", "ensure", "and", "or", "not", "is", "type", "for",

    const command = [python, "-m", "omni_compiler.cli"].concat(args);

  return omnisys.core.length(tokens);

  app.addEventListener("click", function(e) {

    if (!el) return;
    const fn = window[el.getAttribute("click")];
    if (typeof fn === "function") batchUpdate(fn);
  });
