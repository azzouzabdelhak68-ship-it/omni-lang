}

function is_expensive(row) {
  return row.price >= 100;
}

function capture_bolt(row) {

  last_name = row.name;
  last_stock = row.stock;
  return true;
}
  return false;

  rows = OMNISYS.db.select(t, is_expensive);
  console.log(rows);
  changed = OMNISYS.db.update(t, is_bolt, {stock: 4});

  console.log(last_name);
  console.log(last_stock);

  console.log(removed);
  console.log(OMNISYS.db.table_size(t));
}
