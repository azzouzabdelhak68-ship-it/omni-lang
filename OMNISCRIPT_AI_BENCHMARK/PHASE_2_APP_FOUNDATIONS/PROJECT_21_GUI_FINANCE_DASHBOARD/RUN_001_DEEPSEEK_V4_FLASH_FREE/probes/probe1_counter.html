<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>OmniScript App</title></head>
<body>
  <div id="app"></div>
  <script>
// Generated by the OmniScript JS Emitter
let count;

function renderUI() {
  document.getElementById("app").innerHTML = `
<h1>${count}</h1>
<button click="inc">Increment</button>`;
}

function batchUpdate(fn) {
  fn();
  renderUI();
}

function inc() {
  count = count + 1;
}

batchUpdate(function() {
  count = 0;
});

bindClicks();
function bindClicks() {
  document.querySelectorAll("[click]").forEach(function(el) {
    el.onclick = function() { batchUpdate(window[el.getAttribute("click")]); };
  });
}
  </script>
</body>
</html>
