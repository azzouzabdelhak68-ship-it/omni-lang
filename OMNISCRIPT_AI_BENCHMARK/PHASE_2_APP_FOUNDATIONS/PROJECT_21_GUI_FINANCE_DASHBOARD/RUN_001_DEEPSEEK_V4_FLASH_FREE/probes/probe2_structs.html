let t1;
let t2;
let transactions;
let transactions_class;
let view;
let visible_count;

function renderUI() {
  document.getElementById("app").innerHTML = `
<style>
  .panel ${ padding: 8px; }
  .hidden ${ display: none; }
</style>
<div class="${overview_class}"><b>Overview</b> balance=${balance}</div>
<div class="${transactions_class}"><b>Transactions</b> count=${visible_count}</div>
<div class="${breakdown_class}"><b>Breakdown</b></div>
<button click="go_transactions">Go to Transactions</button>
<button click="filter_this_month">Filter this month</button>`;
}

function batchUpdate(fn) {
  fn();
  renderUI();
}

function recompute() {
  balance = 0.0;
  visible_count = 0;
  for (const t of transactions) {
  balance = balance + tx_amount(t);
  visible_count = visible_count + 1;
}
  if (view === "overview") {
  overview_class = "panel";
  transactions_class = "panel hidden";
  breakdown_class = "panel hidden";
}
  if (view === "transactions") {
  overview_class = "panel hidden";
  transactions_class = "panel";
  breakdown_class = "panel hidden";
}
  if (view === "breakdown") {
  overview_class = "panel hidden";
  transactions_class = "panel hidden";
  breakdown_class = "panel";
}
}

function tx_amount(tx) {
  return tx.amount;
}

function go_transactions() {
  view = "transactions";
  recompute();
}

function filter_this_month() {
  visible_count = 0;
  for (const t of transactions) {
  if (tx_date(t) >= "2025-11-01") {
  if (tx_date(t) <= "2025-11-30") {
  visible_count = visible_count + 1;
}
}
}
}

function tx_date(tx) {
  return tx.date;
}

batchUpdate(function() {
  t1 = {date: "2025-11-01", category: "Food", amount: 12.5, description: "Coffee"};
  t2 = {date: "2025-11-03", category: "Rent", amount: 800.0, description: "Rent"};
  transactions = [t1, t2];
  view = "overview";
  balance = 0.0;
  visible_count = 0;
  overview_class = "panel";
  transactions_class = "panel hidden";
  breakdown_class = "panel hidden";
  recompute();
});

function bindClicks() {
  document.querySelectorAll("[click]").forEach(function(el) {
    el.onclick = function() { batchUpdate(window[el.getAttribute("click")]); };
  });
