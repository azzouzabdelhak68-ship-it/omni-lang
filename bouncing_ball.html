<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>OmniScript App</title></head>
<body>
  <div id="app"></div>
  <script>
// Generated by the OmniScript JS Emitter
// IEEE 754 Floating-Point Conformance Helpers
const OmniFP = {
  isNaN: (x) => x !== x,
  isFinite: (x) => x !== Infinity && x !== -Infinity && x === x,
  isInfinite: (x) => x === Infinity || x === -Infinity,
  divide: (a, b) => {
    // Use native division which preserves sign of zero
    return a / b;
  },
  modulo: (a, b) => {
    if (b === 0 || a !== a || b !== b) return NaN;
    if (a === Infinity || a === -Infinity) return NaN;
    return a % b;
  },
  negZero: () => -0,
  copySign: (x, y) => Math.abs(x) * (y < 0 || Object.is(y, -0) ? -1 : 1),
};


function renderUI() {
  const app = document.getElementById("app");
  if (app) app.innerHTML = `
<svg width="800" height="600" style="border: 1px solid #333; background: #fafafa; display: block;">
  <circle cx="20" cy="20" r="20" fill="#e11d48">
    <animate attributeName="cx" values="20;780;20" dur="4s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="cy" values="20;580;20" dur="3s" repeatCount="indefinite" calcMode="linear"/>
  </circle>
</svg>`;
}

async function batchUpdate(fn) {
  await fn();
  renderUI();
}

function bindClicks() {
  const app = document.getElementById("app");
  if (!app || typeof app.addEventListener !== "function") return;
  app.addEventListener("click", function(e) {
    const el = e.target.closest("[click]");
    if (!el) return;
    const fn = window[el.getAttribute("click")];
    if (typeof fn === "function") batchUpdate(fn);
  });
}
bindClicks();
  </script>
</body>
</html>
